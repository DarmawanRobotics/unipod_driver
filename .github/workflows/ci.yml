name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-22.04
    container: ros:foxy-ros-base-focal
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/unipod_driver        # holds unipod_msgs and unipod_driver
      - name: Dependencies
        run: |
          # The image predates the ROS apt key rotation (2025): fetch the current key first.
          rm -f /etc/apt/sources.list.d/ros2*.list
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates
          curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu focal main" \
            > /etc/apt/sources.list.d/ros2.list
          apt-get update
          # Foxy is end-of-life: rosdep skips it unless asked
          rosdep update --rosdistro foxy --include-eol-distros
          rosdep install --from-paths src --ignore-src -y --rosdistro foxy
      - name: Build
        run: |
          source /opt/ros/foxy/setup.bash
          colcon build --event-handlers console_cohesion+ --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Test
        run: |
          source /opt/ros/foxy/setup.bash
          colcon test --event-handlers console_cohesion+
          result=0
          colcon test-result --verbose > test-result.txt 2>&1 || result=$?
          cat test-result.txt
          # the summary (and failures) as annotations, readable without the raw log
          echo "::notice title=Tests::$(tail -n 1 test-result.txt)"
          if [ "$result" != 0 ]; then
            msg=$(head -c 30000 test-result.txt \
              | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
            echo "::error title=Failing tests::$msg"
            exit 1
          fi
      - name: Smoke test (launch against a fake pod)
        run: |
          source /opt/ros/foxy/setup.bash
          source install/setup.bash
          ros2 launch unipod_driver unipod_driver.launch.py --show-args > /dev/null
          result=0
          bash src/unipod_driver/unipod_driver/test/smoke_test.sh > smoke.txt 2>&1 || result=$?
          cat smoke.txt
          echo "::notice title=Smoke test::$(grep -c '^ok' smoke.txt) ok, $(grep -c '^FAIL' smoke.txt) failed"
          if [ "$result" != 0 ]; then
            msg=$(head -c 30000 smoke.txt \
              | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
            echo "::error title=Smoke test output::$msg"
          fi
          exit "$result"
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/*/test_results/**/*.xml
          if-no-files-found: ignore
