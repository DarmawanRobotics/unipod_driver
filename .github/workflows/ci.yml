name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/unipod_driver
      - name: Dependencies
        run: |
          apt-get update
          rosdep update --rosdistro humble
          rosdep install --from-paths src --ignore-src -y --rosdistro humble
      - name: Build
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --event-handlers console_cohesion+ --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Test
        run: |
          source /opt/ros/humble/setup.bash
          colcon test --event-handlers console_cohesion+
          result=0
          colcon test-result --verbose > test-result.txt 2>&1 || result=$?
          cat test-result.txt
          # the summary (and failures) as annotations, readable without the raw log
          echo "::notice title=Tests::$(tail -n 1 test-result.txt)"
          if [ "$result" != 0 ]; then
            msg=$(head -c 30000 test-result.txt \
              | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
            echo "::error title=Failing tests::$msg"
            exit 1
          fi
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/*/test_results/**/*.xml
          if-no-files-found: ignore
